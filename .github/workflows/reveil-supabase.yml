# Garde la base Supabase éveillée.
# Supabase met en pause les projets gratuits restés 7 jours sans activité :
# chaque matin, ce script lit un livret (inexistant), ce qui suffit.
# Il ne fait rien tant que supabaseUrl / supabaseCle sont vides dans config.js.
name: Réveil de la base
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reveil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appeler la base
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' assets/js/config.js || true)
          KEY=$(grep -oP 'supabaseCle:\s*"\K[^"]+' assets/js/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase pas encore configuré : rien à faire."; exit 0; fi
          curl -fsS "${URL%/}/rest/v1/rpc/cdh_livret?p_id=reveil" -H "apikey: $KEY" -o /dev/null -w "Base appelée : HTTP %{http_code}\n"
